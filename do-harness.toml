# do-harness.toml — native do-harness v0.4.x contract for the mixed
# Python / Rust / Node workspace. The compiled CLI is authoritative; see
# AGENTS.md and .agents/skills/do-harness/SKILL.md.
language = "generic"
# Sequential by default: clippy/test/build share one Cargo target directory,
# and concurrent Python/Node sensors make failure evidence harder to attribute.
jobs = 1

[hooks]
pre-commit = [
  "python-lint",
  "python-format",
  "rust-fmt",
  "web-lint",
  "validate-version",
  "validate-skill-mirror",
  "validate-symlink",
]
pre-push = [
  "python-lint",
  "python-format",
  "python-typecheck",
  "python-test",
  "rust-fmt",
  "rust-clippy",
  "rust-test",
  "web-lint",
  "web-typecheck",
  "web-test",
  "cli-ui-lint",
  "cli-ui-test",
  "validate-version",
  "validate-skill-mirror",
  "validate-symlink",
  "validate-docs",
]

# Decision-oriented signal sets. A set names sensors; it never embeds a
# command line. `feedback` is the fast local loop, `verification` is the full
# pre-merge gate, and `release` is the heavier packaging gate.
[signal-sets]
feedback = [
  "python-lint",
  "python-format",
  "rust-fmt",
  "web-lint",
  "web-typecheck",
  "validate-version",
  "validate-skill-mirror",
  "validate-symlink",
  "validate-docs",
]
verification = [
  "python-lint",
  "python-format",
  "python-typecheck",
  "python-test",
  "rust-fmt",
  "rust-clippy",
  "rust-test",
  "rust-build",
  "rust-semantic-cache",
  "web-lint",
  "web-typecheck",
  "web-test",
  "web-build",
  "cli-ui-lint",
  "cli-ui-test",
  "validate-version",
  "validate-skill-mirror",
  "validate-symlink",
  "validate-docs",
]
release = [
  "python-test",
  "rust-test",
  "rust-build",
  "web-test",
  "web-build",
  "validate-version",
  "validate-skill-mirror",
]

# ---------------------------------------------------------------------------
# Python
# ---------------------------------------------------------------------------

[[sensors]]
name = "python-lint"
argv = ["python", "-m", "ruff", "check", "."]
when-changed = ["scripts/**", "tests/**", "pyproject.toml", "requirements.txt"]
inputs = ["scripts/**/*.py", "tests/**/*.py", "tests/fixtures/**", "pyproject.toml", "requirements.txt"]
timeout = 600
fix = "Run `python -m ruff check . --fix` and review the remaining findings."

[[sensors]]
name = "python-format"
argv = ["python", "-m", "black", "--check", "."]
when-changed = ["scripts/**", "tests/**", "pyproject.toml"]
inputs = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]
timeout = 600
fix = "Run `python -m black .`."

[[sensors]]
name = "python-typecheck"
argv = ["python", "-m", "mypy", "scripts/", "--ignore-missing-imports"]
when-changed = ["scripts/**", "mypy.ini", "pyproject.toml"]
inputs = ["scripts/**/*.py", "mypy.ini", "pyproject.toml"]
timeout = 900
fix = "Add or correct type annotations; do not replace real types with `Any`."

[[sensors]]
name = "python-test"
argv = ["python", "-m", "pytest", "-m", "not live and not benchmark", "--tb=short"]
when-changed = ["scripts/**", "tests/**", "pyproject.toml", "requirements.txt"]
inputs = ["scripts/**/*.py", "tests/**/*.py", "tests/fixtures/**", "pyproject.toml", "requirements.txt"]
timeout = 1800
fix = "Run the failing test directly with `python -m pytest tests/test_<name>.py -x`."

# ---------------------------------------------------------------------------
# Rust CLI
# ---------------------------------------------------------------------------

[[sensors]]
name = "rust-fmt"
argv = ["cargo", "fmt", "--manifest-path", "cli/Cargo.toml", "--check"]
when-changed = [
  "cli/src/**",
  "cli/tests/**",
  "cli/benches/**",
  "cli/Cargo.toml",
  "cli/Cargo.lock",
]
inputs = ["cli/src/**", "cli/tests/**", "cli/benches/**", "cli/Cargo.toml", "cli/Cargo.lock"]
timeout = 600
fix = "Run `cargo fmt --manifest-path cli/Cargo.toml`."

[[sensors]]
name = "rust-clippy"
argv = [
  "cargo",
  "clippy",
  "--manifest-path",
  "cli/Cargo.toml",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
when-changed = [
  "cli/src/**",
  "cli/tests/**",
  "cli/benches/**",
  "cli/Cargo.toml",
  "cli/Cargo.lock",
]
inputs = ["cli/src/**", "cli/tests/**", "cli/benches/**", "cli/Cargo.toml", "cli/Cargo.lock"]
timeout = 1800
fix = "Fix the reported Clippy diagnostic; do not add blanket `allow` attributes."

[[sensors]]
name = "rust-test"
argv = ["cargo", "test", "--manifest-path", "cli/Cargo.toml"]
when-changed = [
  "cli/src/**",
  "cli/tests/**",
  "cli/benches/**",
  "cli/Cargo.toml",
  "cli/Cargo.lock",
]
inputs = ["cli/src/**", "cli/tests/**", "cli/benches/**", "cli/Cargo.toml", "cli/Cargo.lock"]
timeout = 1800
fix = "Run `cargo test --manifest-path cli/Cargo.toml` to reproduce the failure."

[[sensors]]
name = "rust-build"
argv = ["cargo", "build", "--release", "--manifest-path", "cli/Cargo.toml"]
when-changed = ["cli/src/**", "cli/Cargo.toml", "cli/Cargo.lock"]
inputs = ["cli/src/**", "cli/Cargo.toml", "cli/Cargo.lock"]
timeout = 1800
fix = "Run `cargo check --manifest-path cli/Cargo.toml` and fix the compiler error."

[[sensors]]
name = "rust-semantic-cache"
argv = ["cargo", "test", "--manifest-path", "cli/Cargo.toml", "--features", "semantic-cache"]
when-changed = [
  "cli/src/**",
  "cli/tests/**",
  "cli/Cargo.toml",
  "cli/Cargo.lock",
]
inputs = ["cli/src/**", "cli/tests/**", "cli/Cargo.toml", "cli/Cargo.lock"]
timeout = 1800
fix = "Run `cargo test --manifest-path cli/Cargo.toml --features semantic-cache` to reproduce the failure."

# ---------------------------------------------------------------------------
# Web and CLI UI
# ---------------------------------------------------------------------------

[[sensors]]
name = "web-lint"
argv = ["npm", "--prefix", "web", "run", "lint"]
when-changed = ["web/**", "web/package.json", "web/package-lock.json"]
inputs = ["web/app/**", "web/lib/**", "web/tests/**", "web/public/**", "web/*.json", "web/*.mjs", "web/*.ts"]
timeout = 900
fix = "Run `npm --prefix web run lint` and resolve each ESLint finding."

[[sensors]]
name = "web-typecheck"
argv = ["npm", "--prefix", "web", "run", "typecheck"]
when-changed = ["web/**", "web/package.json", "web/package-lock.json", "web/tsconfig.json"]
inputs = ["web/app/**", "web/lib/**", "web/tests/**", "web/*.json", "web/*.mjs", "web/*.ts"]
timeout = 900
fix = "Run `npm --prefix web run typecheck`."

[[sensors]]
name = "web-test"
argv = ["npm", "--prefix", "web", "test"]
when-changed = ["web/**", "web/package.json", "web/package-lock.json"]
inputs = ["web/app/**", "web/lib/**", "web/tests/**", "web/*.json", "web/*.mjs", "web/*.ts"]
timeout = 1200
fix = "Run `npm --prefix web test -- --reporter=verbose` for the failing Vitest case."

[[sensors]]
name = "web-build"
argv = ["npm", "--prefix", "web", "run", "build"]
when-changed = ["web/**", "web/package.json", "web/package-lock.json", "web/next.config.mjs"]
inputs = ["web/app/**", "web/lib/**", "web/public/**", "web/*.json", "web/*.mjs", "web/*.ts"]
timeout = 1800
fix = "Run `npm --prefix web run build` and fix the production build error."

[[sensors]]
name = "cli-ui-lint"
argv = ["pnpm", "--dir", "cli/ui", "run", "lint"]
when-changed = ["cli/ui/**", "cli/ui/package.json", "cli/ui/pnpm-lock.yaml"]
inputs = ["cli/ui/components/**", "cli/ui/tokens/**", "cli/ui/layouts/**", "cli/ui/*.json", "cli/ui/*.yaml"]
timeout = 600
fix = "Run `pnpm --dir cli/ui run lint:fix` and review the remaining stylelint findings."

[[sensors]]
name = "cli-ui-test"
argv = ["pnpm", "--dir", "cli/ui", "run", "test"]
when-changed = ["cli/ui/**", "cli/ui/package.json", "cli/ui/pnpm-lock.yaml"]
inputs = ["cli/ui/components/**", "cli/ui/tokens/**", "cli/ui/layouts/**", "cli/ui/*.json", "cli/ui/*.yaml"]
timeout = 600
fix = "Run `pnpm --dir cli/ui run test` to reproduce the CSS validation failure."

# ---------------------------------------------------------------------------
# Cross-cutting repository contracts
# ---------------------------------------------------------------------------

[[sensors]]
name = "validate-version"
argv = ["python", "scripts/sync_versions.py"]
when-changed = [
  "pyproject.toml",
  "cli/Cargo.toml",
  "web/package.json",
  "cli/ui/package.json",
  "scripts/sync_versions.py",
]
inputs = ["pyproject.toml", "cli/Cargo.toml", "web/package.json", "cli/ui/package.json", "scripts/sync_versions.py"]
timeout = 300
fix = "Run `python scripts/sync_versions.py --set <tag-without-v>`."

[[sensors]]
name = "validate-skill-mirror"
argv = ["python", "scripts/sync_skill.py", "--check"]
when-changed = ["scripts/**", ".agents/skills/do-web-doc-resolver/**", "scripts/sync_skill.py"]
inputs = ["scripts/**/*.py", ".agents/skills/do-web-doc-resolver/scripts/**/*.py", "scripts/sync_skill.py"]
timeout = 300
fix = "Run `python scripts/sync_skill.py` to refresh the embedded skill mirror."

[[sensors]]
name = "validate-symlink"
argv = ["python", "scripts/validate_skill_symlink.py"]
when-changed = [".agents/skills/**", "scripts/validate_skill_symlink.py"]
inputs = [".agents/skills/**/*.md", ".agents/skills/**/*.py", "scripts/validate_skill_symlink.py"]
timeout = 300
fix = "Restore the broken skill symlink or remove the dangling entry."

[[sensors]]
name = "validate-docs"
argv = ["python", "scripts/validate_docs.py"]
when-changed = [
  "docs/**",
  "agents-docs/**",
  "README.md",
  "AGENTS.md",
  "scripts/validate_docs.py",
]
inputs = ["docs/**/*.md", "agents-docs/**/*.md", "README.md", "AGENTS.md", "scripts/validate_docs.py"]
timeout = 300
fix = "Fix the reported broken link or missing document index entry."
