name: Nightly Bridge Integration

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      run_full_integration:
        description: 'Run integration tests with secrets'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  nightly-build-and-test:
    name: Nightly Build and Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the branch can be compared to a moving main.
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.85'
          components: rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust CLI
        run: cd cli && cargo build --release

      - name: Run Rust Tests
        run: cd cli && cargo test

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Run Integration Tests
        run: |
          # Live provider calls: retry once so a transient failure does not fail the nightly run.
          for attempt in 1 2; do
            if PYTHONPATH=. pytest tests/integration/; then
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                echo "- **Nightly integration tests**: passed on attempt ${attempt}/2." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            echo "::warning title=Nightly integration tests::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                stamp=$(date -u +%H:%M:%SZ)
                echo "- **Nightly integration tests**: attempt ${attempt} failed at ${stamp}; retrying in 5s." \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              sleep 5
            fi
          done
          echo "::error title=Nightly integration tests::still failing after 2 attempts"
          exit 1
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || 'test_key' }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Format Python
        run: |
          ruff format .
          black .

      - name: Format Rust
        run: cd cli && cargo fmt

      - name: Commit and create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          BRANCH="chore/nightly-format-$(date +%Y%m%d)"

          # A same-day re-run already has a branch and PR; do not duplicate them.
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already tracks $BRANCH; nothing to do."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(ci): automated format and fixup"

          # Guard against empty PRs: if main already carries this formatting
          # delta, the PR would have zero changed files and squash into an
          # empty commit on main.
          git fetch origin main
          if git diff --quiet origin/main...HEAD; then
            echo "Formatting delta is already on main; no PR needed."
            exit 0
          fi
          if ! git cherry origin/main HEAD | grep -q '^+'; then
            echo "An equivalent change is already on main; no PR needed."
            exit 0
          fi

          PATCH_ID=$(git diff origin/main...HEAD | git patch-id --stable | awk '{print $1}')

          # Guard against duplicate PRs: two PRs with the same patch make the
          # later one empty as soon as the first merges.
          for PR in $(gh pr list --state open --base main --json number --jq '.[].number'); do
            PR_PATCH_ID=$(gh pr diff "$PR" | git patch-id --stable | awk '{print $1}')
            if [ -n "$PATCH_ID" ] && [ "$PR_PATCH_ID" = "$PATCH_ID" ]; then
              echo "PR #$PR already proposes this exact change; skipping."
              exit 0
            fi
          done

          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(ci): automated format and fixup" \
            --body "Auto-format fixup from nightly CI run $(date +%Y-%m-%d)." \
            --label automated
