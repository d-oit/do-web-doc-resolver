---
name: "Auto Resolve PR Comments"

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  resolve-outdated:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve Outdated Comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const number = context.payload.pull_request.number;
            let cursor = null;
            do {
              const { repository } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes { id isOutdated isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`, { ...context.repo, number, cursor });
              const threads = repository.pullRequest.reviewThreads;
              for (const thread of threads.nodes) {
                if (thread.isOutdated && !thread.isResolved) {
                  await github.graphql(`
                    mutation($id: ID!) {
                      resolveReviewThread(input: {threadId: $id}) { thread { isResolved } }
                    }`, { id: thread.id });
                }
              }
              cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (cursor);
