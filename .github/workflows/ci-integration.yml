name: Integration Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  free-providers:
    name: Free Providers (Exa MCP + Jina + DDG)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run free provider live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_exa_mcp_no_api_key \
            tests/test_live_api_integrations.py::test_live_jina_no_api_key

      - name: Smoke test CLI (DDG)
        run: |
          # Live provider call: retry once so a transient timeout does not fail the PR.
          for attempt in 1 2; do
            if python -m scripts.cli "Rust agent frameworks" --log-level INFO; then
              exit 0
            fi
            echo "::warning title=DDG smoke test::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then sleep 15; fi
          done
          echo "::error title=DDG smoke test::still failing after 2 attempts"
          exit 1

  mistral-integration:
    name: Mistral Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Mistral live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_mistral_browser_with_real_api_key \
            tests/test_live_api_integrations.py::test_live_mistral_websearch_with_real_api_key
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Smoke test CLI (Mistral)
        run: |
          # Live provider call: retry once so a transient timeout does not fail the PR.
          for attempt in 1 2; do
            if python -m scripts.cli "https://example.com" --log-level INFO; then
              exit 0
            fi
            echo "::warning title=Mistral smoke test::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then sleep 15; fi
          done
          echo "::error title=Mistral smoke test::still failing after 2 attempts"
          exit 1
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  firecrawl-integration:
    name: Firecrawl Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Firecrawl live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_firecrawl_with_real_api_key
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Smoke test CLI (Firecrawl)
        run: |
          # Live provider call: retry once so a transient timeout does not fail the PR.
          for attempt in 1 2; do
            if python -m scripts.cli "https://example.com" --log-level INFO; then
              exit 0
            fi
            echo "::warning title=Firecrawl smoke test::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then sleep 15; fi
          done
          echo "::error title=Firecrawl smoke test::still failing after 2 attempts"
          exit 1
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

  tavily-integration:
    name: Tavily Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Tavily live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_tavily_with_real_api_key
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Smoke test CLI (Tavily)
        run: |
          # Live provider call: retry once so a transient timeout does not fail the PR.
          for attempt in 1 2; do
            if python -m scripts.cli "Rust agent frameworks" --log-level INFO; then
              exit 0
            fi
            echo "::warning title=Tavily smoke test::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then sleep 15; fi
          done
          echo "::error title=Tavily smoke test::still failing after 2 attempts"
          exit 1
        env:
          EXA_API_KEY: ""
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  serper-integration:
    name: Serper Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Serper live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_serper_with_real_api_key
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.85'

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cd cli && cargo build --release

      - name: Smoke test CLI (Serper)
        run: |
          # Live provider call: retry once so a transient 403/timeout does not fail the PR.
          for attempt in 1 2; do
            if ./cli/target/release/do-wdr resolve "Rust agent frameworks" --provider serper; then
              exit 0
            fi
            echo "::warning title=Serper smoke test::attempt ${attempt}/2 failed"
            if [ "${attempt}" -lt 2 ]; then sleep 30; fi
          done
          echo "::error title=Serper smoke test::still failing after 2 attempts"
          exit 1
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}

  exa-integration:
    name: Exa Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run Exa live tests
        run: |
          pytest -m live -s -v \
            tests/test_live_api_integrations.py::test_live_exa_sdk_with_real_api_key
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
