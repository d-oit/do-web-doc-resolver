---
name: Security Scan

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.12'
  RUST_TOOLCHAIN: '1.89'
  NODE_VERSION: '22'
  TRIVY_VERSION: 'v0.76.1'

jobs:
  # ============================================================================
  # SHELL SCRIPT SECURITY SCAN
  # ============================================================================
  shellcheck-security:
    name: Shell Script Security Analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run ShellCheck with Security Focus
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          format: tty
          check_together: 'yes'
          scandir: './scripts'
        env:
          SHELLCHECK_OPTS: >-
            --shell=bash
            --enable=add-default-case,avoid-nullary-conditions,deprecate-which
            --enable=check-unassigned-uppercase,quote-safe-variables

  # ============================================================================
  # TRIVY FILESYSTEM SCAN
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python package metadata discovery
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Trivy from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TRIVY_VERSION#v}"
          archive="trivy_${version}_Linux-64bit.tar.gz"
          checksums="trivy_${version}_checksums.txt"
          download_dir="$RUNNER_TEMP/trivy-release"
          install_dir="$RUNNER_TEMP/trivy"
          mkdir -p "$download_dir" "$install_dir"
          gh release download "$TRIVY_VERSION" \
            --repo aquasecurity/trivy \
            --pattern "$archive" \
            --pattern "$checksums" \
            --dir "$download_dir"
          (
            cd "$download_dir"
            sha256sum --check --ignore-missing "$checksums"
          )
          tar -xzf "$download_dir/$archive" -C "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          skip-dirs: '.cache,.opencode'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ============================================================================
  # DEPENDENCY AUDIT
  # ============================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (web)
        run: |
          cd web && npm ci --legacy-peer-deps
          npm audit --audit-level=low

      - name: Run npm audit (OpenCode)
        working-directory: .opencode
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=low

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          # RUSTSEC-2026-0258: low-severity h2 DoS; direct h2 bumped to 0.4.18,
          # remaining transitive h2 0.3.x via tonic 0.11 <- libsql has no patch (see deny.toml)
          cd cli && cargo audit --ignore RUSTSEC-2026-0258

  # ============================================================================
  # RUST SECURITY (SAST, Deny, Outdated)
  # ============================================================================
  rust-security:
    name: Rust Security Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      - name: Run clippy (strict)
        run: cd cli && cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./cli/Cargo.toml

      - name: Run cargo outdated
        run: |
          cargo install cargo-outdated --version 0.19.0 --locked
          cd cli && cargo outdated --exit-code 0

  # ============================================================================
  # SECRETS SCAN (Deep History)
  # ============================================================================
  secrets-scan:
    name: Secret Scanning (Full History)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --pattern 'gitleaks_8.30.1_checksums.txt'
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks

      - name: Run Gitleaks
        run: ./gitleaks git --redact --verbose --log-opts="--all"

  # ============================================================================
  # AGGREGATE SECURITY REPORT
  # ============================================================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-24.04
    needs:
      - shellcheck-security
      - trivy-fs
      - dependency-audit
      - rust-security
      - secrets-scan
    if: always()
    steps:
      - name: Generate Security Report
        run: |
          echo "=========================================="
          echo "     🔒 SECURITY SCAN SUMMARY"
          echo "=========================================="
          echo ""
          echo "Job Results:"
          echo "  • ShellCheck Security: ${{ needs.shellcheck-security.result }}"
          echo "  • Trivy Filesystem: ${{ needs.trivy-fs.result }}"
          echo "  • Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "  • Rust Security: ${{ needs.rust-security.result }}"
          echo "  • Secrets Scan: ${{ needs.secrets-scan.result }}"
          echo ""

          if [[ "${{ needs.shellcheck-security.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy-fs.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.rust-security.result }}" == "failure" ]] || \
             [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ CRITICAL/HIGH vulnerabilities detected!"
            exit 1
          else
            echo "✅ All critical security checks passed."
          fi
