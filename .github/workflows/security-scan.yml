---
name: Security Scan

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: '3.12'
  RUST_TOOLCHAIN: '1.89'
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # SHELL SCRIPT SECURITY SCAN
  # ============================================================================
  shellcheck-security:
    name: Shell Script Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run ShellCheck with Security Focus
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        continue-on-error: true
        with:
          severity: warning
          format: tty
          check_together: 'yes'
          scandir: './scripts'
        env:
          SHELLCHECK_OPTS: >-
            --shell=bash
            --enable=add-default-case,avoid-nullary-conditions,deprecate-which
            --enable=check-unassigned-uppercase,quote-safe-variables

      - name: ShellCheck SARIF Output
        if: always()
        run: |
          mapfile -t script_files < <(find scripts .agents/skills -name "*.sh" -type f 2>/dev/null || true)
          if [[ ${#script_files[@]} -gt 0 ]]; then
            shellcheck -f sarif -s bash -S warning "${script_files[@]}" > shellcheck-results.sarif 2>/dev/null || true
          fi
          if [[ ! -s shellcheck-results.sarif ]] || ! python3 -c "import json,sys; json.load(open('shellcheck-results.sarif'))" 2>/dev/null; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"shellcheck","informationUri":"https://www.shellcheck.net/"}},"results":[]}]}' > shellcheck-results.sarif
          fi

      - name: Upload ShellCheck SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        continue-on-error: true
        with:
          sarif_file: shellcheck-results.sarif
          category: shellcheck

  # ============================================================================
  # TRIVY FILESYSTEM SCAN
  # ============================================================================
  trivy-fs:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  # ============================================================================
  # CODEQL ANALYSIS
  # ============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for JS/Python files
        id: check_files
        run: |
          if find . -name "*.js" -o -name "*.ts" -o -name "*.py" | grep -q .; then
            echo "has_codeql_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_codeql_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.check_files.outputs.has_codeql_files == 'true'
        uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        continue-on-error: true
        with:
          languages: javascript,python
          queries: security-extended,security-and-quality

      - name: Autobuild
        if: steps.check_files.outputs.has_codeql_files == 'true'
        uses: github/codeql-action/autobuild@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        continue-on-error: true

      - name: Perform CodeQL Analysis
        if: steps.check_files.outputs.has_codeql_files == 'true'
        uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        continue-on-error: true

      - name: Generate/Upload empty SARIF if no files
        if: steps.check_files.outputs.has_codeql_files == 'false'
        run: |
          echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL","informationUri":"https://codeql.github.com/","rules":[]}},"results":[],"properties":{"semmle.formatSpecifier":"sarifv2.1.0"}}]}' > codeql-empty-results.sarif

      - name: Upload empty CodeQL SARIF
        if: steps.check_files.outputs.has_codeql_files == 'false'
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        continue-on-error: true
        with:
          sarif_file: codeql-empty-results.sarif
          category: "/language:javascript"

  # ============================================================================
  # INFRASTRUCTURE AS CODE SCAN
  # ============================================================================
  iac-scan:
    name: Infrastructure as Code Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan GitHub Actions with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.github/workflows/'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload IaC Scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # v2.25.6
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-config

  # ============================================================================
  # DEPENDENCY AUDIT
  # ============================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit (web)
        run: cd web && npm audit --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cd cli && cargo audit

  # ============================================================================
  # RUST SECURITY (SAST, Deny, Outdated)
  # ============================================================================
  rust-security:
    name: Rust Security Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      - name: Run clippy (strict)
        run: cd cli && cargo clippy --all-targets --all-features -- -D warnings

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ./cli/Cargo.toml

      - name: Run cargo outdated
        continue-on-error: true
        run: |
          cargo install cargo-outdated
          cd cli && cargo outdated --exit-code 0

  # ============================================================================
  # SECRETS SCAN (Deep History)
  # ============================================================================
  secrets-scan:
    name: Secret Scanning (Full History)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # AGGREGATE SECURITY REPORT
  # ============================================================================
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs:
      - shellcheck-security
      - trivy-fs
      - codeql
      - iac-scan
      - dependency-audit
      - rust-security
      - secrets-scan
    if: always()
    steps:
      - name: Generate Security Report
        run: |
          echo "=========================================="
          echo "     🔒 SECURITY SCAN SUMMARY"
          echo "=========================================="
          echo ""
          echo "Job Results:"
          echo "  • ShellCheck Security: ${{ needs.shellcheck-security.result }}"
          echo "  • Trivy Filesystem: ${{ needs.trivy-fs.result }}"
          echo "  • CodeQL Analysis: ${{ needs.codeql.result }}"
          echo "  • IaC Scan: ${{ needs.iac-scan.result }}"
          echo "  • Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "  • Rust Security: ${{ needs.rust-security.result }}"
          echo "  • Secrets Scan: ${{ needs.secrets-scan.result }}"
          echo ""

          if [[ "${{ needs.shellcheck-security.result }}" == "failure" ]] || \
             [[ "${{ needs.trivy-fs.result }}" == "failure" ]] || \
             [[ "${{ needs.dependency-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.rust-security.result }}" == "failure" ]] || \
             [[ "${{ needs.secrets-scan.result }}" == "failure" ]]; then
            echo "❌ CRITICAL/HIGH vulnerabilities detected!"
            exit 1
          else
            echo "✅ All critical security checks passed."
          fi
